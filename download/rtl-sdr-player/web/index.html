<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTL-SDR Player</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f14'/%3E%3Cpath d='M4 20c3-8 5 4 8-4s5 6 8-2 5 4 8-2' stroke='%2322d3ee' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#0e141b"/>
      <path d="M4 20c3-8 5 4 8-4s5 6 8-2 5 4 8-2" stroke="#22d3ee" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </svg>
    <span class="brand-name">RTL-SDR Player</span>
    <span class="brand-ver" id="app-version"></span>
  </div>
  <div class="device-pill" id="device-pill">
    <span class="dot" id="status-dot"></span>
    <span id="device-name">connecting&hellip;</span>
  </div>
</header>

<main class="layout">

  <!-- ===================== LEFT: CONTROLS ===================== -->
  <aside class="panel controls">

    <div class="readout">
      <span class="freq" id="freq-display">98.30</span>
      <span class="unit" id="freq-unit">MHz</span>
    </div>
    <div class="band-desc" id="band-desc">Broadcast FM</div>

    <nav class="tabs" id="band-tabs">
      <button data-band="wfm" class="tab active">FM</button>
      <button data-band="am" class="tab">AM</button>
      <button data-band="wx" class="tab">WX</button>
      <button data-band="air" class="tab">AIR</button>
      <button data-band="tv" class="tab">TV</button>
    </nav>

    <div id="radio-controls">
      <div class="tuner">
        <button id="dn-big" class="btn" title="Down 1 MHz">&laquo;</button>
        <button id="dn" class="btn" title="Down 100 kHz">&lsaquo;</button>
        <button id="up" class="btn" title="Up 100 kHz">&rsaquo;</button>
        <button id="up-big" class="btn" title="Up 1 MHz">&raquo;</button>
      </div>
      <div class="freq-entry">
        <label for="freq-input">Frequency</label>
        <input id="freq-input" inputmode="decimal" spellcheck="false">
        <button id="freq-go" class="btn btn-accent">Go</button>
      </div>

      <div class="presets" id="presets"></div>

      <div class="meter-row">
        <span class="lbl">SIGNAL</span>
        <div class="meter"><div class="meter-fill" id="meter-fill"></div></div>
        <span class="meter-db" id="meter-db">&mdash;</span>
      </div>

      <div class="vol-row">
        <span class="lbl">VOL</span>
        <input type="range" id="volume" min="0" max="100" value="70">
        <svg class="spk" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9.5 9.5 0 0 1 0 13"/></svg>
      </div>

      <div class="gain-row">
        <span class="lbl">GAIN</span>
        <select id="gain-select"><option value="auto">Auto (AGC)</option></select>
      </div>

      <div class="demod-line" id="demod-line">WFM &middot; &mdash;</div>

      <div class="rds" id="rds-panel" hidden>
        <div class="rds-head">
          <span class="rds-title">RDS</span>
          <span class="rds-flags" id="rds-flags"></span>
        </div>
        <div class="rds-ps" id="rds-ps">&mdash;</div>
        <div class="rds-meta" id="rds-meta">searching for RDS&hellip;</div>
        <div class="rds-rt" id="rds-rt"></div>
        <div class="rds-af" id="rds-af"></div>
      </div>

      <div class="scan" id="scan-panel" hidden>
        <div class="scan-head">
          <span class="scan-title">SCANNER</span>
          <span class="scan-state" id="scan-state">idle</span>
        </div>
        <div class="scan-row">
          <select id="scan-list"></select>
          <button id="scan-btn" class="btn btn-accent scan-btn">Scan</button>
        </div>
        <div class="scan-row sq-row">
          <span class="lbl">SQL</span>
          <input type="range" id="squelch" min="-60" max="-5" value="-30" step="1">
          <span class="scan-db" id="squelch-val">-30 dB</span>
        </div>
        <div class="scan-row sq-row">
          <span class="lbl">LVL</span>
          <div class="meter"><div class="meter-fill chan" id="chan-fill"></div></div>
          <span class="scan-db" id="chan-val">&mdash;</span>
        </div>
        <div class="scan-log" id="scan-log"></div>
      </div>
    </div>

  </aside>

  <!-- ===================== RIGHT: SPECTRUM / WATERFALL ===================== -->
  <section class="panel scope" id="view-spectrum">
    <div class="scope-head">
      <span class="scope-title">SPECTRUM</span>
      <span class="scope-info" id="scope-info">&mdash;</span>
    </div>
    <div class="canvas-wrap">
      <canvas id="spectrum"></canvas>
      <div class="freq-axis" id="freq-axis"></div>
      <canvas id="waterfall"></canvas>
    </div>
    <div class="scope-hint">Click or drag anywhere on the spectrum to tune &middot; waterfall scrolls below</div>
  </section>

  <!-- ===================== RIGHT: TV ===================== -->
  <section class="panel tv" id="view-tv" hidden>
    <div class="scope-head">
      <span class="scope-title">DIGITAL TV (DVB-T)</span>
      <span class="scope-info" id="tv-badge">&mdash;</span>
    </div>
    <div id="tv-body"><!-- filled by app.js --></div>
  </section>

</main>

<footer class="statusbar">
  <span class="stat"><span class="stat-k">STREAM</span> <span id="stat-ws">connecting&hellip;</span></span>
  <span class="stat"><span class="stat-k">BUFFER</span> <span id="stat-buffer">&mdash;</span></span>
  <span class="stat stat-right" id="stat-note"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
